<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTT V2 // Quản trị</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="/admin.html"><span class="brand-mark">O</span><strong>OTT V2 ADMIN</strong></a>
      <button id="admin-logout" class="secondary-button" type="button">Đăng xuất Admin</button>
    </header>
    <section class="lobby-panel" style="margin:40px auto; max-width:900px;">
      <p class="eyebrow">QUẢN TRỊ</p>
      <h1>Giám sát hệ thống</h1>
      <p id="metrics-status" class="message" aria-live="polite">Đang tải metrics…</p>
      <div id="system-metrics" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px"></div>
      <hr style="margin:28px 0;border:0;border-top:1px solid var(--line)">
      <h1>Người chơi</h1>
      <p id="admin-message" class="message"></p>
      <div id="admin-users"></div>
      <hr style="margin:28px 0;border:0;border-top:1px solid var(--line)">
      <h2>Tạo giải cộng đồng</h2>
      <form id="community-create" style="display:grid;gap:10px;max-width:460px">
        <input id="community-name" placeholder="Tên giải" maxlength="60" required>
        <select id="community-mode"><option value="army">9v9 Đại chiến</option><option value="tactical">6v6 Chiến thuật</option><option value="classic">3v3 Nhanh</option></select>
        <input id="community-turns" type="number" min="20" max="2000" value="300">
        <button class="primary-button">Tạo giải đăng ký</button>
      </form>
      <p id="community-message" class="message"></p>
      <div id="community-events"></div>
    </section>
  </main>
  <script>
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    document.getElementById('admin-logout').onclick = async () => {
      try {
        await fetch('/api/admin/logout', { method: 'POST' });
        location.replace('/admin-login.html');
      } catch (error) {
        document.getElementById('admin-message').textContent = error.message;
      }
    };
    const metricsPanel = document.getElementById('system-metrics');
    const metricsStatus = document.getElementById('metrics-status');
    async function loadMetrics() {
      try {
        const response = await fetch('/api/admin/metrics');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Không thể tải metrics.');
        metricsPanel.innerHTML = [
          ['WebSocket', data.connections],
          ['Phòng đang chạy', data.rooms],
          ['Phòng có người chơi', data.roomsWithPlayers],
          ['RAM (RSS)', `${(data.memory.rssBytes / 1024 / 1024).toFixed(1)} MB`],
          ['Heap', `${(data.memory.heapUsedBytes / 1024 / 1024).toFixed(1)} / ${(data.memory.heapTotalBytes / 1024 / 1024).toFixed(1)} MB`],
          ['CPU tiến trình', `${data.cpu.percent.toFixed(1)}%`],
          ['WebSocket RTT P95', data.latencyMs.p95 === null ? '—' : `${data.latencyMs.p95} ms`],
          ['Bot tiến trình', data.botProcesses],
          ['Uptime', `${Math.floor(data.uptimeSeconds / 60)} phút`]
        ].map(([label, value]) => `
          <div style="padding:14px;border:1px solid var(--line);border-radius:8px">
            <small>${label}</small><div style="font-size:1.35rem;font-weight:700">${value}</div>
          </div>`).join('');
        metricsStatus.textContent = `Cập nhật lúc ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        metricsStatus.textContent = error.message;
      }
    }
    loadMetrics();
    setInterval(loadMetrics, 5000);

    fetch('/api/admin/users').then(async response => {
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Không có quyền.');
      document.getElementById('admin-users').innerHTML = data.users.map(user =>
        `<div style="display:grid;grid-template-columns:1fr repeat(4,auto);gap:18px;padding:12px;border-bottom:1px solid var(--line)">
          <strong>${escapeHtml(user.username)}</strong><span>${escapeHtml(user.rank)}</span><span>${escapeHtml(user.elo)} ELO</span><span>${escapeHtml(user.wins)}/${escapeHtml(user.games)} thắng</span><small>${escapeHtml(user.createdAt)}</small>
        </div>`).join('');
    }).catch(error => document.getElementById('admin-message').textContent = error.message);
    async function loadCommunity() {
      const response = await fetch('/api/community-tournaments');
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Không thể tải giải cộng đồng.');
      document.getElementById('community-events').innerHTML = data.tournaments.map(event => `
        <div style="border:1px solid var(--line);padding:14px;margin-top:12px;border-radius:8px">
          <strong>${escapeHtml(event.name)}</strong> · ${escapeHtml(event.status)} · ${event.players.length}/12 người
          ${event.status === 'registration' ? `<button data-start="${escapeHtml(event.id)}" class="secondary-button" style="float:right" ${event.players.length < 2 || event.players.some(player => !player.botId) ? 'disabled' : ''}>Bắt đầu</button>` : ''}
          <div>${event.players.map(player => `${escapeHtml(player.username)} — ${escapeHtml(player.botName || 'Đang chờ tải bot')}`).join('<br>') || 'Chưa có người đăng ký'}</div>
          ${event.status === 'registration' && event.players.some(player => !player.botId) ? '<small class="muted">Chưa thể bắt đầu: cần mọi người tham gia tải bot lên.</small>' : ''}
          ${event.champion ? `<strong>🏆 ${escapeHtml(event.champion)}</strong>` : ''}
        </div>`).join('');
      document.querySelectorAll('[data-start]').forEach(button => button.onclick = async () => {
        const result = await fetch(`/api/community-tournaments/${button.dataset.start}/start`, { method: 'POST' });
        const body = await result.json();
        document.getElementById('community-message').textContent = body.error || 'Đã bắt đầu giải.';
        loadCommunity();
      });
    }
    document.getElementById('community-create').onsubmit = async event => {
      event.preventDefault();
      const response = await fetch('/api/community-tournaments', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({
        name: document.getElementById('community-name').value,
        mode: document.getElementById('community-mode').value,
        maxTurns: Number(document.getElementById('community-turns').value)
      })});
      const data = await response.json();
      document.getElementById('community-message').textContent = data.error || 'Đã tạo giải.';
      if (response.ok) loadCommunity();
    };
    loadCommunity().catch(error => document.getElementById('community-message').textContent = error.message);
  </script>
</body>
</html>
